[package]
name = "phantom-spider"
version = "0.1.0"
edition = "2021"
description = "Native PC port of the Nokia S40 J2ME game Phantom Spider"
license = "MIT"
repository = "https://github.com/Xarishark/phantom-spider"
readme = "README.md"
keywords = ["game", "port", "j2me", "sdl3", "nokia"]
categories = ["games"]
publish = false

[dependencies]
png = "0.18"
rustysynth = "1.3"
embedded-graphics = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Windows builds link SDL3 statically (single .exe); other platforms use the
# system SDL3 library.
[target.'cfg(windows)'.dependencies]
sdl3 = { version = "0.22", features = ["build-from-source-static"] }

[target.'cfg(not(windows))'.dependencies]
sdl3 = { version = "0.22" }
