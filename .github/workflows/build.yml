name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Every archive ships the GeneralUser GS SoundFont for the music; it isn't in
# the repository, so each job downloads the pinned, checksummed copy
# (tools/fetch-soundfont.sh) and package-release.sh puts it in the archive.

jobs:
  windows:
    name: Build Windows x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up MinGW and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 cmake ninja-build
          rustup update stable
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
      - name: Build Windows release
        run: |
          bash tools/fetch-soundfont.sh "$RUNNER_TEMP/sf"
          SOUNDFONT="$RUNNER_TEMP/sf/GeneralUser-GS.sf2" SOUNDFONT_LICENSE="$RUNNER_TEMP/sf/LICENSE.txt" \
            bash tools/package-release.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/PhantomSpiderRE-*-Windows-x64.zip
          if-no-files-found: error

  linux:
    name: Build Linux x64
    # the oldest supported runner, so the program runs on older glibc too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up SDL3 build dependencies and Rust
        # SDL is linked statically; these headers let it load X11, Wayland,
        # audio, controllers and so on from the player's system at run time
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev
          rustup update stable
          rustup default stable
      - name: Test
        run: cargo test --release --locked
      - name: Build Linux release
        run: |
          bash tools/fetch-soundfont.sh "$RUNNER_TEMP/sf"
          SOUNDFONT="$RUNNER_TEMP/sf/GeneralUser-GS.sf2" SOUNDFONT_LICENSE="$RUNNER_TEMP/sf/LICENSE.txt" \
            bash tools/package-release.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/PhantomSpiderRE-*-Linux-x64.tar.gz
          if-no-files-found: error

  macos:
    name: Build macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Build macOS release
        run: |
          bash tools/fetch-soundfont.sh "$RUNNER_TEMP/sf"
          SOUNDFONT="$RUNNER_TEMP/sf/GeneralUser-GS.sf2" SOUNDFONT_LICENSE="$RUNNER_TEMP/sf/LICENSE.txt" \
            bash tools/package-release.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/PhantomSpiderRE-*-macOS-arm64.zip
          if-no-files-found: error

  release:
    name: Publish release
    # only for a pushed version tag, e.g. v1.3.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "Phantom Spider RE ${TAG#v}" --generate-notes
